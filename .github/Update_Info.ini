[Latest_Version]
Ver="v3.142.01"
[Change_log]
log="\n- Many improvements in latest version incl. new super-resolution and frame interpolation; see online Change log.\n- 您正在使用老旧版本，建议立即更新；新版含新的超分辨率与补帧技术等多项改进，详见在线更新日志。\n- 您正在使用老舊版本，建議立即更新；新版含新的超解析度與補幀技術等多項改進，詳見線上更新日誌。"
log_SimplifiedChinese="\n- ★重大更新★\n- 实验性功能：[流式 VFI] 通过全新视频处理管线大幅加速视频补帧\n- 实测补帧速度最高约提升3倍\n- beta：启用后视频补帧任务（仅补帧、放大+补帧）走新流式管线\n- 更快、缓存大降；长视频免分段；不写帧图像缓存到磁盘\n- [流式 VFI] 位于 [杂项] 选项卡\n- 其他：移除 SRMD-CUDA 引擎，相关预设自动回退 SRMD-NCNN-Vulkan；移除 waifu2x-caffe cuDNN 支持（文件不随附，下载约减700MB），现有 cuDNN 预设自动切 GPU；兼容性测试后硬件加速提示合并为单对话框\n- 修复：补全剩余缺失 UI 翻译；批处理完成摘要偶显错误[已完成]数；循环优化+分段处理时接缝错误帧；目标 FPS 模式下 VFR 尾帧循环优化不正确\n\n更新日期: 2026年10月2日"
log_TraditionalChinese="\n- ★重大更新★\n- 實驗性功能：[串流 VFI] 透過全新視訊處理管線大幅加速視訊補幀\n- 實測補幀速度最高約提升3倍\n- beta：啟用後視訊補幀任務（僅補幀、放大+補幀）走新串流管線\n- 更快、快取大降；長影片免分段；不寫影格影像快取到磁碟\n- [串流 VFI] 位於 [雜項] 索引標籤\n- 其他：移除 SRMD-CUDA 引擎，相關預設集自動回退 SRMD-NCNN-Vulkan；移除 waifu2x-caffe cuDNN 支援（檔案不隨附，下載約減700MB），現有 cuDNN 預設集自動切 GPU；相容性測試後硬體加速提示合併為單對話方塊\n- 修正：補齊剩餘缺失 UI 翻譯；批次完成摘要偶顯錯誤[已完成]數；迴圈最佳化+分段處理時接縫錯誤影格；目標 FPS 模式下 VFR 尾端影格迴圈最佳化不正確\n\n更新日期: 2026年10月2日"
log_English="\n- ★Major Update★\n- Experimental [Streaming VFI] ([Misc]): all-new video pipeline greatly speeds up frame interpolation; measured up to ~3x faster\n- Beta: when enabled, interpolation-only and upscale+interpolation tasks use the new streaming pipeline\n- Faster, much lower cache footprint; long videos need no segmentation; no frame-image cache files written to disk\n- Other: SRMD-CUDA removed, presets auto-fall back to SRMD-NCNN-Vulkan; waifu2x-caffe cuDNN support removed (files not shipped, ~700 MB smaller download), existing cuDNN presets auto-switch to GPU; hardware-acceleration prompts after compatibility test merged into one dialog\n- Fixes: completed missing UI translations; batch-complete summary occasionally showed wrong [completed] count; bad frames at segment seams with loop optimization + segmentation; incorrect VFR tail-frame loop optimization in target-FPS mode\n\nRelease Date: October 2, 2026"
