[Change_log]
log="\n- A lot improvements has been made in the latest version, please check online Change log page to learn more.\n\n- 您正在使用老旧版本, 建议立即更新. 最新版中已进行了很多改进, 包含新的超分辨率和补帧(插帧)技术. 请查阅在线更新日志页面以了解更多.\n\n- 您正在使用老舊版本, 建議立即更新. 最新版中已進行了很多改進, 包含新的超分辨率和補幀(插幀)技術. 請查閱在線更新日誌頁面以了解更多."
log_SimplifiedChinese="\n- ★重大更新★\n- 实验性功能：[流式 VFI] 通过全新的视频处理管线大幅加速视频补帧\n- 在实际测试中测得补帧速度最高可提升约 3 倍\n- 目前处于测试阶段：启用后，视频补帧任务（仅补帧以及放大 + 补帧工作流）都将通过新的流式管线处理\n- 不仅速度显著更快，缓存占用也大幅降低，长视频不再需要分段处理，并且不会向磁盘写入帧图像缓存文件\n- [流式 VFI] 位于 [杂项] 选项卡中\n- 其他变更：\n- 已移除 SRMD-CUDA 引擎；使用该引擎的预设会自动回退到 SRMD-NCNN-Vulkan\n- 已移除 waifu2x-caffe 的 cuDNN 支持（其文件不再随附，下载体积约减少 700 MB）；现有 cuDNN 预设会自动切换到 GPU\n- 兼容性测试后的硬件加速提示已合并为单个对话框\n- 错误修复：\n- 补全了剩余缺失的 UI 翻译\n- 修复了批处理完成后摘要对话框偶尔显示错误的 [已完成] 数量的问题\n- 修复了同时启用循环优化和分段处理时分段接缝处出现错误帧的问题\n- 修复了目标 FPS 模式下 VFR 视频尾帧循环优化不正确的问题\n\n更新日期: 2026年10月2日"
log_TraditionalChinese="\n- ★重大更新★\n- 實驗性功能：[串流 VFI] 透過全新的視訊處理管線大幅加速視訊補幀\n- 在實際測試中測得補幀速度最高可提升約 3 倍\n- 目前處於測試階段：啟用後，視訊補幀任務（僅補幀以及放大 + 補幀工作流程）都將透過新的串流管線處理\n- 不僅速度顯著更快，快取佔用也大幅降低，長影片不再需要分段處理，並且不會將影格影像快取檔案寫入磁碟\n- [串流 VFI] 位於 [雜項] 索引標籤中\n- 其他變更：\n- 已移除 SRMD-CUDA 引擎；使用該引擎的預設集會自動回退到 SRMD-NCNN-Vulkan\n- 已移除 waifu2x-caffe 的 cuDNN 支援（其檔案不再隨附，下載體積約減少 700 MB）；現有 cuDNN 預設集會自動切換到 GPU\n- 相容性測試後的硬體加速提示已合併為單一對話方塊\n- 錯誤修正：\n- 補齊了剩餘缺失的 UI 翻譯\n- 修正了批次處理完成後摘要對話方塊偶爾顯示錯誤的 [已完成] 數量的問題\n- 修正了同時啟用迴圈最佳化和分段處理時分段接縫處出現錯誤影格的問題\n- 修正了目標 FPS 模式下 VFR 視訊尾端影格迴圈最佳化不正確的問題\n\n更新日期: 2026年10月2日"
log_English="\n- ★Major Update★\n- Experimental feature: [Streaming VFI] dramatically speeds up video frame interpolation with an all-new video processing pipeline\n- Measured up to ~3x faster frame interpolation in real-world tests\n- Currently in beta: when enabled, video frame interpolation tasks (interpolation-only and upscale + interpolation workflows alike) are processed through the new streaming pipeline\n- Not only significantly faster, but also drastically lower cache footprint, long videos no longer need to be processed by segment, and no frame-image cache files are written to disk\n- [Streaming VFI] is located in the [Misc] tab\n- Other changes:\n- The SRMD-CUDA engine has been removed; presets that used it automatically fall back to SRMD-NCNN-Vulkan\n- cuDNN support has been removed from waifu2x-caffe (its files no longer ship, about 700 MB smaller download); existing cuDNN presets automatically switch to GPU\n- The hardware-acceleration prompts after the compatibility test have been merged into a single dialog\n- Bug fixes:\n- Completed the remaining missing UI translations\n- Fixed the summary dialog occasionally showing incorrect [Completed] counts after a batch finishes\n- Fixed wrong frames at segment seams when loop optimization and segment processing are both enabled\n- Fixed incorrect loop optimization of tail frames for VFR videos in target-FPS mode\n- ★ Other recent updates you might missed:\n- Dark Mode: Now you can switch between light/dark mode skin at the Home tab.\n- NEW Image Batch Upscale Pipeline, Over 300% Performance Boost.\n\nRelease Date: October 2, 2026"
