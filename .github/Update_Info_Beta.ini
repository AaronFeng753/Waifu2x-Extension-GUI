Ver="v3.140.01"
[Change_log]
log="\n- A lot improvements has been made in the latest version, please check online Change log page to learn more.\n\n- 您正在使用老旧版本, 建议立即更新. 最新版中已进行了很多改进, 包含新的超分辨率和补帧(插帧)技术. 请查阅在线更新日志页面以了解更多.\n\n- 您正在使用老舊版本, 建議立即更新. 最新版中已進行了很多改進, 包含新的超分辨率和補幀(插幀)技術. 請查閱在線更新日誌頁面以了解更多."
log_SimplifiedChinese="\n- 重大更新：\n- ★ 深色模式 ☆\n- 现在您可以在“主页”标签页中切换浅色/深色模式皮肤。\n- 新增：[保留原图 ICC]。保存图片时将保留 ICC 色彩配置文件。\n- 部分图片在放大后的色彩准确度将得到提升。\n- 新增：通过右键菜单可快速访问日志文件夹。\n- Bug 修复：\n- 修复了显存（VRAM）读取问题，现在更准确且兼容性更好。\n- 修复了核心批量计算逻辑，提高了空间预估准确度和任务分组。\n- 以及更多修复，请查看完整更新日志。\n- 您可能错过的其他近期更新：\n- 新增图片批量放大管线，性能提升超过 300%。\n- 新增：西班牙语语言包。\n\n更新日期: 2026年8月2日"
log_TraditionalChinese="\n- 重大更新：\n- ★ 深色模式 ☆\n- 現在您可以在「首頁」分頁中切換淺色/深色模式外觀。\n- 新增：[保留原圖 ICC]。儲存圖片時將保留 ICC 色彩設定檔。\n- 部分圖片在放大後的色彩精準度將會提升。\n- 新增：可透過右鍵選單快速存取記錄檔資料夾。\n- 錯誤修正：\n- 修正了顯示記憶體（VRAM）讀取，現在更精準且相容性更好。\n- 修正了核心批次計算邏輯，提升容量預估精準度與任務分組。\n- 更多修正內容，請參閱完整變更記錄。\n- 您可能錯過的其他近期更新：\n- 新增圖片批次放大管線，效能提升超過 300%。\n- 新增：西班牙語語言包。\n\n更新日期: 2026年8月2日"
log_English="\n- MAJOR UPDATE:\n- ★ Dark Mode ☆\n- Now you can switch between light/dark mode skin at the Home tab.\n- NEW: [Keep ICC of the source image]. ICC color profiles are now preserved when saving pictures.\n- The after-upscale color accuracy of some pictures will be better.\n- NEW: Added quick access to the log folder via the right-click context menu.\n- Bug Fixes:\n- Fixed VRAM readings, now more accurate and better compatibility.\n- Fixed core batch calculation logic, improving space estimation accuracy and task grouping.\n- And more fixes, please check the full change log.\n- Other recent updates you might missed:\n- NEW Image Batch Upscale Pipeline, Over 300% Performance Boost.\n- NEW: Spanish Language Pack.\n\nRelease Date: August 2, 2026"
