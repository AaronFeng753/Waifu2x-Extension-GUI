[Latest_Version]
Ver="v3.140.17-beta"
[Change_log]
log="\n- A lot improvements has been made in the latest version, please check online Change log page to learn more.\n\n- 您正在使用老旧版本, 建议立即更新. 最新版中已进行了很多改进, 包含新的超分辨率和补帧(插帧)技术. 请查阅在线更新日志页面以了解更多.\n\n- 您正在使用老舊版本, 建議立即更新. 最新版中已進行了很多改進, 包含新的超分辨率和補幀(插幀)技術. 請查閱在線更新日誌頁面以了解更多."
log_SimplifiedChinese="\n- 文件列表状态完成内部重构，并补全了缺失的非英文翻译。\n- 修复 Bug：\n- 保存与通知：手动保存文件列表时，“保存成功”通知现在能稳定显示，改为记录日志而非弹出窗口。\n- 自动保存（关机、自动归档）不再触发对话框。\n- 自定义分辨率：修复了大写扩展名（例如相机拍摄的 .JPG）被误识别为视频导致“无法获取分辨率”错误的问题；\n- 修复了移除应用了自定义分辨率的文件过程中的并发缺陷。\n- 自动关机：修复了倒计时对话框中的崩溃风险，以及关机过程中可能出现的表格保存卡死问题。\n- 文件导入：修复了回收站回退时的潜在栈溢出问题、UNC 网络路径/非本地 URL 防护、路径规范化以及多点文件名处理问题。\n- 性能：修复了对话框和设置保存过程中的内存泄漏，降低了长时间运行时的整体内存占用。\n- 深色模式：长列表上的滚动条滑块不再消失。\n- 修复了其他一些深色模式 UI 问题。\n- 界面布局进行了一部分优化。\n\n更新日期: 2026年8月16日"
log_TraditionalChinese="\n- 檔案列表狀態完成內部重構，並補全了缺少的非英文翻譯。\n- 修復 Bug：\n- 儲存與通知：手動儲存檔案列表時，「儲存成功」通知現在能穩定顯示，改為記錄日誌而非跳出視窗。\n- 自動儲存（關機、自動歸檔）不再觸發對話盒。\n- 自訂解析度：修復了大寫副檔名（例如相機拍攝的 .JPG）被誤識別為影片導致「無法取得解析度」錯誤的問題；\n- 修復了移除套用自訂解析度的檔案過程中的並行缺陷。\n- 自動關機：修復了倒數對話盒中的當機風險，以及關機過程中可能出現的表格儲存凍結問題。\n- 檔案匯入：修復了資源回收筒退回時的潛在堆疊溢位問題、UNC 網路路徑/非本機 URL 防護、路徑規範化以及多點檔名處理問題。\n- 效能：修復了對話盒與設定儲存過程中的記憶體洩漏，降低了長時間執行時的整體記憶體使用量。\n- 深色模式：長列表上的捲軸滑塊不再消失。\n- 修復了其他一些深色模式 UI 問題。\n- 介面佈局進行了一部分優化。\n\n更新日期: 2026年8月16日"
log_English="\n- NEW: 日本語翻訳を追加！\n- Add Japanese translation.\n- Files List status refactored internally and missing non-English translations completed.\n- Fix bugs:\n- Save & Notifications: The "Save successful" notification now appears reliably when manually saving the file list, logged instead of triggering popups.\n- Automatic saves (shutdown, auto-archive) no longer trigger dialogs.\n- Custom Resolution: Fixed uppercase extensions (e.g. camera-produced .JPG) misidentified as videos causing "Unable to get resolution" errors;\n- Fixed concurrency defects during removal of files with custom resolution applied.\n- Auto-Shutdown: Fixed crash risk in countdown dialog and potential table-saving freezes during shutdown.\n- File Import: Fixed potential stack overflow in recycle-bin fallback, UNC network path/non-local URL guards, path normalization, and multi-dot filename handling.\n- Performance: Fixed memory leaks across dialogs and settings saving, reducing overall memory usage during long sessions.\n- Dark Mode: Scrollbar handle no longer disappears on long lists.\n- Fixed some other dark mode ui issues.\n- Some UI layout improvements.\n\nRelease Date: August 16, 2026"
