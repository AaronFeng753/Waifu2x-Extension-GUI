[Latest_Version]
Ver="v3.142.17-beta"
[Change_log]
log="\n- A lot improvements has been made in the latest version, please check online Change log page to learn more.\n\n- 您正在使用老旧版本, 建议立即更新. 最新版中已进行了很多改进, 包含新的超分辨率和补帧(插帧)技术. 请查阅在线更新日志页面以了解更多.\n\n- 您正在使用老舊版本, 建議立即更新. 最新版中已進行了很多改進, 包含新的超分辨率和補幀(插幀)技術. 請查閱在線更新日誌頁面以了解更多."
log_SimplifiedChinese="\n- ★又一次重大更新★\n- 新实验性功能：[Turbo 视频]，更快的视频超分和帧插值, 位于附加设置.\n- 使用 [Real-ESRGAN] 的视频超分速度提升 2.2 倍\n- [RIFE] 视频帧插值 + [Real-ESRGAN] 超分速度提升 2 倍\n- [Real-ESRGAN] 和 [RIFE] 引擎现已支持流式视频处理。\n- 新的流式视频超分和帧插值现已合并为单个开关(Turbo 视频)\n- 帧现在直接通过处理管线流式传输，而不再写入帧文件夹。\n- 图像批处理现已永久启用。测试版开关已被移除。\n- [NVIDIA RTX 50 系列 GPU] 开关现已被移除。\n\n更新日期: 2026年10月17日"
log_TraditionalChinese="\n- ★又一次重大更新★\n- 新實驗性功能：[Turbo Video]，更快的影片超分和幀插值。\n- 使用 [Real-ESRGAN] 的影片超分速度提升 2.2 倍\n- [RIFE] 影片幀插值 + [Real-ESRGAN] 超分速度提升 2 倍\n- [Real-ESRGAN] 和 [RIFE] 引擎現已支援串流影片處理。\n- 新的串流影片超分和幀插值現已合併為單一開關。\n- 幀現在直接透過處理管線串流傳輸，而不再寫入幀資料夾。\n- 圖像批次處理現已永久啟用。測試版開關已被移除。\n- [NVIDIA RTX 50 系列 GPU] 開關現已被移除。\n\n更新日期: 2026年10月17日"
log_English="\n- ★Yet Another Major Update★\n- New Experimental Feature: [Turbo Video], Faster Video Upscaling and Frame Interpolation, at Misc Tab.\n- 2.2x Faster Video Upscaling with [Real-ESRGAN]\n- 2x Faster [RIFE] Video Frame Interpolation + [Real-ESRGAN] Upscaling\n- Streaming Video Processing is now available for the [Real-ESRGAN] and [RIFE] engines.\n- The new Streaming Video Upscaling and Frame Interpolation are now a single toggle.\n- Frames are streamed directly through the pipeline instead of being written to frame folders.\n- Image batching is now permanently enabled. The beta toggle has been removed.\n- The [NVIDIA RTX 50-series GPUs] toggle has now been removed.\n\nRelease Date: October 17, 2026"
