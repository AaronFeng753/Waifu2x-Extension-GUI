[Latest_Version]
Ver="v3.143.22-beta"
[Change_log]
log="\n- A lot improvements has been made in the latest version, please check online Change log page to learn more.\n\n- 您正在使用老旧版本, 建议立即更新. 最新版中已进行了很多改进, 包含新的超分辨率和补帧(插帧)技术. 请查阅在线更新日志页面以了解更多.\n\n- 您正在使用老舊版本, 建議立即更新. 最新版中已進行了很多改進, 包含新的超分辨率和補幀(插幀)技術. 請查閱在線更新日誌頁面以了解更多."
log_SimplifiedChinese="\n- 新功能：输出文件重命名设置\n- 通过组合前缀/后缀项目自定义输出文件名，例如序号、引擎、画质等。\n- 位置：[输出文件夹] 区域，位于 [打开输出文件夹] 按钮旁边。\n- [预处理加速] 现在可与 [Turbo 视频] 同时使用。\n- 开启 [Turbo 视频] 后，也可以启用 [预处理加速]；原先的回退机制已移除。\n- 该组合省去一次有损中间转码，减少画质损失。\n- 修复：选择“单遍处理”时帧率处理不正确，可能导致输出帧率异常。\n- 修复：[Turbo 视频] 在帧率重新检测或内部帧控制数据生成失败时未正确报告错误的问题。\n- 失败现在会被明确标记，以避免生成不可靠的输出。\n- 修复：[预处理加速] 与 [Turbo 视频] 同时使用时可能出现的偶发失败和错误复用过期缓存的问题。\n- 修复：[智能加速] 在使用 [Turbo 视频] 时导致不必要的回退的问题。\n\n更新日期: 2026年11月20日"
log_TraditionalChinese="\n- 新功能：輸出檔案重新命名設定\n- 透過組合前綴/後綴項目來自訂輸出檔名，例如序號、引擎、畫質等。\n- 位置：[輸出資料夾] 區段，位於 [查看輸出資料夾] 按鈕旁。\n- [預處理加速] 現在可與 [極速影片] 同時使用。\n- 開啟 [極速影片] 後，也可以啟用 [預處理加速]；原先的回退機制已移除。\n- 此組合省去一次有損中間轉碼，減少畫質損失。\n- 修正：選擇「單次處理」時幀率處理不正確，可能導致輸出幀率異常。\n- 修正：[極速影片] 在幀率重新偵測或內部幀控制資料產生失敗時未正確回報錯誤的問題。\n- 失敗現在會被明確標記，以避免產生不可靠的輸出。\n- 修正：[預處理加速] 與 [極速影片] 同時使用時可能發生的偶發失敗和錯誤重用過期緩存的問題。\n- 修正：[智能加速] 在使用 [極速影片] 時造成不必要的回退的問題。\n\n更新日期: 2026年11月20日"
log_English="\n- NEW Feature: Output file Rename settings\n- Customize output filenames by combining prefix/suffix items such as sequence number, engine, quality, and more.\n- Location: [Output Folder] section, next to the View Output Folder button\n- [Pre-processing Boost] can now be used together with [Turbo Video].\n- After enabling [Turbo Video], you can also enable [Pre-processing Boost]; the previous fallback mechanism has been removed.\n- This combination removes one lossy intermediate transcode, reducing quality loss.\n- Fixed: Frame rate was handled incorrectly when Single-pass was selected, potentially causing an incorrect output frame rate.\n- Fixed: [Turbo Video] did not report an error correctly if frame-rate re-detection or internal frame control data generation failed.\n- Failures are now explicitly marked to prevent unreliable output from being generated.\n- Fixed: Occasional failures and incorrect reuse of stale cache that could occur when [Pre-processing Boost] and [Turbo Video] were used together.\n- Fixed: [Speed Boost] causing unnecessary fallback when using [Turbo Video].\n\nRelease Date: November 20, 2026"
