[Latest_Version]
Ver="v3.143.01"
[Change_log]
log="\n- A lot improvements has been made in the latest version, please check online Change log page to learn more.\n\n- 您正在使用老旧版本, 建议立即更新. 最新版中已进行了很多改进, 包含新的超分辨率和补帧(插帧)技术. 请查阅在线更新日志页面以了解更多.\n\n- 您正在使用老舊版本, 建議立即更新. 最新版中已進行了很多改進, 包含新的超分辨率和補幀(插幀)技術. 請查閱在線更新日誌頁面以了解更多."
log_SimplifiedChinese="\n- 新功能：[Turbo 视频]，更快的视频放大和补帧，位于“杂项”选项卡。\n- 启用[Turbo 视频]时，新增[链接模式]选择器。\n- 选择[单遍处理]以并行运行视频放大和补帧。\n- 使用[Real-ESRGAN]实现2.2倍更快的视频放大。\n- 使用[RIFE]实现2倍更快的视频补帧，并结合[Real-ESRGAN]进行放大。\n- Turbo 视频（流式视频处理）现已适用于[Real-ESRGAN]和[RIFE]引擎。\n- 帧直接通过管线流式传输，而不是写入帧文件夹。\n- 更新了[设置预设]：更好地利用更新后的引擎和模型。\n\n更新日期: 2026年11月2日"
log_TraditionalChinese="\n- 新功能：[Turbo 影片]，更快的影片放大和補幀，位於「雜項」索引標籤。\n- 啟用[Turbo 影片]時，新增[連結模式]選擇器。\n- 選擇[單遍處理]以平行執行影片放大和補幀。\n- 使用[Real-ESRGAN]實現2.2倍更快的影片放大。\n- 使用[RIFE]實現2倍更快的影片補幀，並結合[Real-ESRGAN]進行放大。\n- Turbo 影片（串流影片處理）現已適用於[Real-ESRGAN]和[RIFE]引擎。\n- 影格直接透過管線串流傳輸，而不是寫入影格資料夾。\n- 更新了[設定預設]：更好地利用更新後的引擎和模型。\n\n更新日期: 2026年11月2日"
log_English="\n- New feature: [Turbo Video], faster video upscaling and frame interpolation, on the Misc tab.\n- A new [Chain Mode] selector is available when [Turbo Video] is enabled.\n- Choose [Single Pass] to run video upscaling and frame interpolation in parallel.\n- 2.2x faster video upscaling with [Real-ESRGAN].\n- 2x faster video frame interpolation with [RIFE] plus upscaling with [Real-ESRGAN].\n- Turbo Video(Streaming video processing) is now available for the [Real-ESRGAN] and [RIFE] engines.\n- Frames are streamed directly through the pipeline instead of being written to frame folders.\n- Updated [Presets]: better utilization of the updated engines and models.\n\nRelease Date: November 2, 2026"
