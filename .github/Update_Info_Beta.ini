[Latest_Version]
Ver="v3.141.18-beta"
[Change_log]
log="\n- A lot improvements has been made in the latest version, please check online Change log page to learn more.\n\n- 您正在使用老旧版本, 建议立即更新. 最新版中已进行了很多改进, 包含新的超分辨率和补帧(插帧)技术. 请查阅在线更新日志页面以了解更多.\n\n- 您正在使用老舊版本, 建議立即更新. 最新版中已進行了很多改進, 包含新的超分辨率和補幀(插幀)技術. 請查閱在線更新日誌頁面以了解更多."
log_SimplifiedChinese="\n- ★重大更新★\n- 实验性功能: [流式补帧] 大幅加快视频补帧速度, 全新视频处理管道\n- 实测视频补帧速度加快近3倍\n- 当前为测试阶段, 启用后暂时只有视频的[仅补帧]任务改用全新流式管道处理\n- 不仅显著提升速度，缓存占用同时显著减少，长视频无需分段, 且不再产生帧图片文件缓存\n- 原生支持 VFR 视频，输出 MKV 保留原始时间戳\n- [流式补帧] 位于 [附加设置] 选项卡\n- 修复问题:\n- 修复批量处理完成后总结弹窗偶现错误的[已完成]数据\n- 修复循环视频优化与分段处理并存时，分段衔接处画面出错\n- 修复 VFR 视频目标帧率模式下结尾帧循环优化不正确\n\n更新日期: 2026年9月19日"
log_TraditionalChinese="\n- ★重大更新★\n- 實驗性功能: [串流式補幀] 大幅加快影片補幀速度, 全新影片處理管道\n- 實測影片補幀速度加快近3倍\n- 當前為測試階段, 啟用後暫時只有影片的[僅補幀]任務改用全新串流式管道處理\n- 不僅顯著提升速度，快取佔用同時顯著減少，長影片無需分段, 且不再產生幀圖片檔案快取\n- 原生支援 VFR 影片，輸出 MKV 保留原始時間戳記\n- [串流式補幀] 位於 [附加設定] 分頁\n- 修復問題:\n- 修復批次處理完成後總結彈窗偶現錯誤的[已完成]資料\n- 修復循環影片優化與分段處理並存時，分段銜接處畫面出錯\n- 修復 VFR 影片目標幀率模式下結尾幀循環優化不正確\n\n更新日期: 2026年9月19日"
log_English="\n- ★Major Update★\n- Experimental feature: [Streaming VFI] dramatically speeds up video frame interpolation with an all-new video processing pipeline\n- Measured up to ~3x faster frame interpolation in real-world tests\n- Currently in beta: when enabled, only [Frame Interpolation only (Video)] tasks are processed through the new streaming pipeline for now\n- Not only significantly faster, but also drastically lower cache footprint, long videos no longer need to be processed by segment, and no frame-image cache files are written to disk\n- Native VFR support: original timestamps are preserved when outputting MKV\n- [Streaming VFI] is located in the [Misc] tab\n- Bug fixes:\n- Fixed the summary dialog occasionally showing incorrect [Completed] counts after a batch finishes\n- Fixed wrong frames at segment seams when loop optimization and segment processing are both enabled\n- Fixed incorrect loop optimization of tail frames for VFR videos in target-FPS mode\n\nRelease Date: September 19, 2026"
