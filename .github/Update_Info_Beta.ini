[Latest_Version]
Ver="v3.143.11-beta"
[Change_log]
log="\n- A lot improvements has been made in the latest version, please check online Change log page to learn more.\n\n- 您正在使用老旧版本, 建议立即更新. 最新版中已进行了很多改进, 包含新的超分辨率和补帧(插帧)技术. 请查阅在线更新日志页面以了解更多.\n\n- 您正在使用老舊版本, 建議立即更新. 最新版中已進行了很多改進, 包含新的超分辨率和補幀(插幀)技術. 請查閱在線更新日誌頁面以了解更多."
log_SimplifiedChinese="\n- GUI 调整，以减少垂直空间占用并提高与笔记本电脑屏幕的兼容性。\n- 对内部 GUI 进行小幅调整，以减少浪费空间并使整体布局更紧凑。\n- 将标签页按钮移到左侧，使其不再占用垂直空间。\n- 新增 [Lab] 标签页：未来的实验性功能将集中在此标签页下。\n- [Turbo Video] 功能已移至 [Lab] 标签页。\n\n更新日期: 2026年11月10日"
log_TraditionalChinese="\n- GUI 調整，以減少垂直空間佔用並提高與筆記型電腦螢幕的相容性。\n- 對內部 GUI 進行小幅調整，以減少浪費空間並使整體版面更緊湊。\n- 將分頁按鈕移到左側，使其不再佔用垂直空間。\n- 新增 [Lab] 分頁：未來的實驗性功能將集中在此分頁下。\n- [Turbo Video] 功能已移至 [Lab] 分頁。\n\n更新日期: 2026年11月10日"
log_English="\n- 새로운 언어 팩 한국어를 추가했습니다.\n- New language pack: Korean.\n- GUI adjustments to reduce vertical space usage and improve compatibility with laptop screens.\n- Minor internal GUI tweaks to reduce wasted space and make the overall layout more compact.\n- Moved tab buttons to the left side so they no longer take up vertical space.\n- Added a new [Lab] tab: future experimental features will be consolidated under this tab.\n- [Turbo Video] feature has been moved to [Lab] tab.\n\nRelease Date: November 10, 2026"
